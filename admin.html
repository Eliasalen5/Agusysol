<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Owner | Sol &amp; Agus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <h1>Panel de los novios ♥</h1>
    <p class="sub">Confirmaciones de la invitación</p>

    <!-- Marcador para que no exista un botón "Atrás" -->
    <div id="vista-login" hidden>
      <form id="formLogin" class="caja-login" novalidate>
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" placeholder="owner@email.com" required>
        <label for="loginPass">Contraseña</label>
        <input type="password" id="loginPass" name="password" placeholder="••••••••" required>
        <button type="submit" class="btn" id="btnLogin">Entrar</button>
        <p class="feedback" id="loginFeedback" role="status"></p>
      </form>
    </div>

    <div id="vista-denegado" hidden>
      <p class="error-panel">Acceso denegado. Esta área es solo para el owner.</p>
    </div>

    <div id="vista-panel" hidden>
      <div class="accion-superior">
        <button type="button" class="btn" id="btnAgregar">Agregar confirmación</button>
        <button type="button" class="btn btn-sec" id="btnCambiarPass">Cambiar contraseña</button>
        <button type="button" class="btn btn-sec" id="btnSalir">Cerrar sesión</button>
      </div>

      <div class="resumen">
        <div class="cifra">
          <strong id="cTotal">0</strong>
          <span>Confirmaciones</span>
        </div>
        <div class="cifra">
          <strong id="cAsisten">0</strong>
          <span>Asisten</span>
        </div>
        <div class="cifra">
          <strong id="cNoAsisten">0</strong>
          <span>No asisten</span>
        </div>
      </div>

      <div id="estadoLista" class="cargando">Cargando confirmaciones…</div>
      <div class="lista-confirmaciones" id="lista"></div>
    </div>

    <div class="modal-fondo" id="modalConfirmacion" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalConfirmacionTitulo">
        <h2 id="modalConfirmacionTitulo">Agregar confirmación</h2>
        <form id="formConfirmacion" novalidate>
          <label for="confNombre">Nombre completo</label>
          <input type="text" id="confNombre" name="nombre" placeholder="Nombre y apellido" required>

          <label for="confTelefono">Número de contacto</label>
          <input type="text" id="confTelefono" name="telefono" inputmode="tel" placeholder="Número de WhatsApp" required>

          <span class="etiqueta">¿Asiste?</span>
          <div class="opciones">
            <label class="opcion">
              <input type="radio" name="confAsiste" value="si" required>
              <span>Sí, asiste</span>
            </label>
            <label class="opcion">
              <input type="radio" name="confAsiste" value="no">
              <span>No podrá asistir</span>
            </label>
          </div>

          <label for="confRestricciones">Restricciones alimentarias <em>(opcional)</em></label>
          <input type="text" id="confRestricciones" name="restricciones" placeholder="Ej: vegetariano, sin gluten">

          <label for="confMusica">Recomendación musical <em>(opcional)</em></label>
          <input type="text" id="confMusica" name="musica" placeholder="Canción para bailar">

          <label for="confMensaje">Mensaje o felicitación <em>(opcional)</em></label>
          <textarea id="confMensaje" name="mensaje" rows="3" placeholder="Un mensaje para la pareja"></textarea>

          <div class="modal-acciones">
            <button type="button" class="btn btn-sec" id="btnCancelarConfirmacion">Cancelar</button>
            <button type="submit" class="btn" id="btnGuardarConfirmacion">Guardar</button>
          </div>
          <p class="feedback" id="confirmacionFeedback" role="status"></p>
        </form>
      </div>
    </div>

    <div class="modal-fondo" id="modalPass" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalPassTitulo">
        <h2 id="modalPassTitulo">Cambiar contraseña</h2>
        <form id="formPass" novalidate>
          <label for="passActual">Contraseña actual</label>
          <input type="password" id="passActual" name="passActual" autocomplete="current-password" required>

          <label for="passNueva">Nueva contraseña</label>
          <input type="password" id="passNueva" name="passNueva" autocomplete="new-password" required>

          <label for="passConfirm">Confirmar nueva contraseña</label>
          <input type="password" id="passConfirm" name="passConfirm" autocomplete="new-password" required>

          <div class="modal-acciones">
            <button type="button" class="btn btn-sec" id="btnCancelarPass">Cancelar</button>
            <button type="submit" class="btn" id="btnGuardarPass">Guardar</button>
          </div>
          <p class="feedback" id="passFeedback" role="status"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>
  <script src="util.js"></script>
  <script src="admin.js"></script>
</body>
</html>
